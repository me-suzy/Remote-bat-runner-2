<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Open ChatGPT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #4c1d95, #0f172a 70%);
    color: #f8fafc; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; gap: 22px;
  }
  h1 { margin: 0; font-size: 22px; opacity: .92; }
  button {
    width: 240px; height: 240px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(145deg, #8b5cf6, #6d28d9); color: white;
    font-size: 26px; font-weight: 700;
    box-shadow: 0 20px 40px rgba(139,92,246,.35), inset 0 -6px 12px rgba(0,0,0,.25);
  }
  button:active { transform: scale(.96); }
  button[disabled] { filter: grayscale(.5) brightness(.75); cursor: wait; }
  #status { min-height: 28px; font-size: 16px; text-align: center; opacity: .9; max-width: 320px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  a { color: #c4b5fd; text-decoration: none; border: 1px solid rgba(196,181,253,.4); padding: 10px 18px; border-radius: 10px; }
  small { opacity: .55; text-align: center; max-width: 340px; }
</style>
</head>
<body>
  <h1>ChatGPT on laptop</h1>
  <button id="open">OPEN<br>CHATGPT</button>
  <div id="status"></div>
  <a href="/remote">Vezi fereastra și conversează →</a>
  <a href="/">← Arcanum</a>
  <small>Starts or activates the local ChatGPT Windows app in the logged-in desktop session.</small>
<script>
  const btn = document.getElementById("open");
  const status = document.getElementById("status");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    status.className = "";
    status.textContent = "Sending...";
    try {
      const r = await fetch("/open-chatgpt", { method: "POST", headers: {"X-Requested-With": "RemoteRunner"} });
      const j = await r.json();
      if (j.ok) {
        status.className = "ok";
        status.textContent = j.message || "ChatGPT started on laptop";
      } else {
        status.className = "err";
        status.textContent = "Error: " + (j.error || "unknown");
      }
    } catch (e) {
      status.className = "err";
      status.textContent = "Network: " + e.message;
    } finally {
      setTimeout(() => { btn.disabled = false; }, 1500);
    }
  });
</script>
</body>
</html>
